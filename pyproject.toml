[project]
name = "retry-hard-bounces-postmark"
# Keep in sync with retry_bounces.__version__ and the README Changelog.
version = "0.1.0"
description = "Discover and resend Postmark voicemail emails that were blocked by hard-bounce suppressions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "David Szpunar" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "InquirerPy>=0.3.4",
    "python-dotenv>=1.0",
    "tzdata>=2026.2",
]

[project.urls]
Author = "https://david.szpunar.com"

[project.scripts]
retry-bounces = "retry_bounces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retry_bounces"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
